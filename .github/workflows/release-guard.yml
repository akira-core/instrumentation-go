# Release guard: fails a pushed release tag if the module's reported
# instrumentation version constant doesn't match the tag. See VERSIONING.md
# for the tag format and the version-constant location table this workflow
# implements. Exists because a hand-maintained constant with no automated
# check has already shipped wrong once (otel-nats 0.5.0 reported "0.4.1" on
# every span).
name: Release Tag Guard

on:
  push:
    tags:
      - "otel-mongo/v[0-9]*"
      - "otel-mongo/v2/v[0-9]*"
      - "otel-nats/v[0-9]*"
      - "otel-gorilla-ws/v[0-9]*"
      - "otel-sampler/v[0-9]*"
      - "otel-flags/v[0-9]*"

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify tag matches version constant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compare tag version against the module's version constant
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "Tag: $TAG"

          # Case order matters — bash `case` takes the first matching pattern:
          # the deprecated otel-mongo/v2/v* shape must fail before the plain
          # otel-mongo/v* patterns get a chance to (mis)match it. The v2
          # module's Go-resolvable tag shape is otel-mongo/v2.x.y (its module
          # path ends in the /v2 major-version suffix, so Go strips the suffix
          # from the tag prefix and requires version major 2 — see
          # VERSIONING.md); the historical otel-mongo/v2/v0.x.y shape was
          # never resolvable by Go tooling and is rejected outright here.
          case "$TAG" in
            otel-mongo/v2/v*)
              echo "::error::Tag shape $TAG is not resolvable by Go tooling (a module path ending in /v2 requires tags of shape otel-mongo/v2.x.y). Delete this tag and push otel-mongo/v2.x.y instead — see VERSIONING.md."
              exit 1
              ;;
            otel-mongo/v2.*)
              MODULE="otel-mongo/v2"
              VERSION="${TAG#otel-mongo/v}"
              FILE="otel-mongo/v2/version.go"
              CONST_VERSION=$(grep -E '^\s*(const\s+)?instrumentationVersion\s*=' "$FILE" | sed -E 's/.*"([^"]+)".*/\1/')
              ;;
            otel-mongo/v*)
              MODULE="otel-mongo"
              VERSION="${TAG#otel-mongo/v}"
              FILE="otel-mongo/otelmongo/version.go"
              CONST_VERSION=$(grep -E '^\s*(const\s+)?instrumentationVersion\s*=' "$FILE" | sed -E 's/.*"([^"]+)".*/\1/')
              ;;
            otel-nats/v*)
              MODULE="otel-nats"
              VERSION="${TAG#otel-nats/v}"
              FILE="otel-nats/otelnats/conn.go"
              CONST_VERSION=$(grep -E '^\s*(const\s+)?instrumentationVersion\s*=' "$FILE" | sed -E 's/.*"([^"]+)".*/\1/')
              ;;
            otel-gorilla-ws/v*)
              MODULE="otel-gorilla-ws"
              VERSION="${TAG#otel-gorilla-ws/v}"
              FILE="otel-gorilla-ws/version.go"
              CONST_VERSION=$(grep -E '^\s*return\s*"' "$FILE" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
              ;;
            otel-sampler/v*)
              MODULE="otel-sampler"
              VERSION="${TAG#otel-sampler/v}"
              FILE="otel-sampler/otelsampler/version.go"
              CONST_VERSION=$(grep -E '^\s*(const\s+)?instrumentationVersion\s*=' "$FILE" | sed -E 's/.*"([^"]+)".*/\1/')
              ;;
            otel-flags/v*)
              MODULE="otel-flags"
              VERSION="${TAG#otel-flags/v}"
              FILE="otel-flags/version.go"
              CONST_VERSION=$(grep -E '^\s*(const\s+)?instrumentationVersion\s*=' "$FILE" | sed -E 's/.*"([^"]+)".*/\1/')
              ;;
            *)
              echo "::error::Unrecognized release tag shape: $TAG (expected <module>/vX.Y.Z per VERSIONING.md)"
              exit 1
              ;;
          esac

          echo "Module:           $MODULE"
          echo "Tag version:      $VERSION"
          echo "Constant version: $CONST_VERSION (from $FILE)"

          if [ "$VERSION" != "$CONST_VERSION" ]; then
            echo "::error::Tag $TAG declares version $VERSION but $FILE reports $CONST_VERSION — bump the constant and push a new commit before re-tagging."
            exit 1
          fi

          echo "OK: $TAG matches the version constant in $FILE"

      - name: Reject an in-repo replace directive
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            otel-mongo/v2.*) MODULE="otel-mongo/v2" ;;
            otel-mongo/v*)   MODULE="otel-mongo" ;;
            otel-nats/v*)    MODULE="otel-nats" ;;
            otel-gorilla-ws/v*) MODULE="otel-gorilla-ws" ;;
            otel-sampler/v*) MODULE="otel-sampler" ;;
            otel-flags/v*)   MODULE="otel-flags" ;;
            *) echo "::error::Unrecognized tag shape: $TAG"; exit 1 ;;
          esac

          # A `replace` pointing at another module in this repository is a
          # development-time device: it makes the working tree build against
          # itself before otel-flags is published. Consumers IGNORE a replace in
          # a dependency's go.mod, so one that reaches a published tag does not
          # merely have no effect — it leaves the module requiring a version that
          # may not exist, and every `go get` of it fails.
          #
          # The failure is invisible until someone outside this repo tries to
          # build, which is exactly the class of mistake a human checklist loses
          # to. Hence a check rather than a note in VERSIONING.md.
          if grep -nE '^\s*replace\s+github\.com/akira-core/instrumentation-go' "$MODULE/go.mod"; then
            echo "::error::$MODULE/go.mod carries a replace directive pointing at an in-repo module. Consumers ignore it, so this tag would be unbuildable. Remove the replace, run 'GOWORK=off go mod tidy', commit, and re-tag."
            exit 1
          fi

          echo "OK: $MODULE/go.mod carries no in-repo replace directive"
