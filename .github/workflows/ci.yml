# CI: unit tests and golangci-lint for all Go modules in this repo.
name: CI

on:
  push:
    branches: [main, master, "feat/*"]
  pull_request:
    branches: [main, master, "feat/*"]

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - otel-flags
          - otel-sampler
          - otel-testkit
          - otel-mongo
          - otel-mongo/v2
          - otel-nats
          - otel-gorilla-ws
    # GOWORK=off for every step in this job.
    #
    # The repo-root go.work exists so local development can build the four
    # instrumentation modules against the working tree's otel-flags. CI must NOT
    # use it: the point of this job is to verify each module exactly as a
    # consumer resolves it, from its own go.mod. With the workspace active a
    # missing or wrong `require` would pass here and fail for everyone else.
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false

      - name: Build
        run: go build ./...
        working-directory: ${{ matrix.module }}

      - name: Test
        run: go test -v -race ./...
        working-directory: ${{ matrix.module }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: ${{ matrix.module }}

      - name: Verify direct/ has no OTel SDK imports
        # Enforces the otel-mongo disabled-mode invariant: internal/direct/
        # packages must never import go.opentelemetry.io/otel/* so the
        # compiler can prove no SDK code path is reachable when tracing is off.
        if: matrix.module == 'otel-mongo' || matrix.module == 'otel-mongo/v2'
        run: |
          if [ -d "internal/direct" ]; then
            if grep -rE '"go\.opentelemetry\.io/otel' internal/direct; then
              echo "::error::internal/direct/ must not import go.opentelemetry.io/otel/*"
              exit 1
            fi
            echo "OK: internal/direct/ has zero OTel SDK imports"
          fi
        working-directory: ${{ matrix.module }}

  integration-test:
    name: Integration (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: test-and-lint
    strategy:
      fail-fast: false
      matrix:
        module:
          - otel-nats/tests/integration
          - otel-mongo/tests/integration
          - otel-mongo/v2/tests/integration
          - otel-gorilla-ws/tests/integration
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false

      - name: Integration Tests
        # The ./sampling packages are excluded on purpose: they are the
        # feature-flag × sampler-arg matrix, and the dedicated sampling-e2e /
        # nats-sampling-e2e jobs are the only place they should run. Without
        # this, every heavyweight Docker suite runs twice per push, and the
        # 300s budget here has to cover a suite the dedicated jobs give 600s.
        run: go test -v -race -timeout 300s $(go list ./... | grep -v '/sampling$')
        working-directory: ${{ matrix.module }}

  sampling-e2e:
    name: Sampling E2E (${{ matrix.row.name }})
    runs-on: ubuntu-latest
    needs: test-and-lint
    strategy:
      fail-fast: false
      matrix:
        row:
          - { name: all-on,            global: "1", mongo: "1", prop: "1", arg: "1.0" }
          - { name: all-on-half,       global: "1", mongo: "1", prop: "1", arg: "0.5" }
          - { name: propagation-off,   global: "1", mongo: "1", prop: "0", arg: "1.0" }
          - { name: mongo-tracing-off, global: "1", mongo: "0", prop: "1", arg: "1.0" }
          - { name: global-off,        global: "0", mongo: "1", prop: "1", arg: "1.0" }
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false

      - name: Consistent-sampling E2E
        working-directory: otel-mongo/v2/tests/integration
        env:
          OTEL_INSTRUMENTATION_GO_TRACING_ENABLED: ${{ matrix.row.global }}
          OTEL_MONGO_TRACING_ENABLED: ${{ matrix.row.mongo }}
          OTEL_MONGO_PROPAGATION_ENABLED: ${{ matrix.row.prop }}
          OTEL_TRACES_SAMPLER_ARG: ${{ matrix.row.arg }}
        run: go test -race -timeout 600s -run TestMongo ./sampling/

  nats-sampling-e2e:
    name: NATS Sampling E2E (${{ matrix.row.name }})
    runs-on: ubuntu-latest
    needs: test-and-lint
    strategy:
      fail-fast: false
      matrix:
        # otel-nats has a single tracing gate (no independent propagation
        # flag), so the matrix has 4 rows instead of mongo's 5.
        row:
          - { name: all-on,           global: "1", nats: "1", arg: "1.0" }
          - { name: all-on-half,      global: "1", nats: "1", arg: "0.5" }
          - { name: nats-tracing-off, global: "1", nats: "0", arg: "1.0" }
          - { name: global-off,       global: "0", nats: "1", arg: "1.0" }
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false

      - name: NATS consistent-sampling E2E
        working-directory: otel-nats/tests/integration
        env:
          OTEL_INSTRUMENTATION_GO_TRACING_ENABLED: ${{ matrix.row.global }}
          OTEL_NATS_TRACING_ENABLED: ${{ matrix.row.nats }}
          OTEL_TRACES_SAMPLER_ARG: ${{ matrix.row.arg }}
        run: go test -race -timeout 600s -run TestNats ./sampling/

  http-direct-e2e:
    name: Sampling E2E (http-direct + stdlib baseline)
    runs-on: ubuntu-latest
    needs: test-and-lint
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false

      - name: golangci-lint (httpdirect)
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: otel-testkit/examples/httpdirect

      - name: golangci-lint (httpdirect-stdlib)
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: otel-testkit/examples/httpdirect-stdlib

      - name: Black-box (HTTP) consistent-sampling E2E
        working-directory: otel-testkit/examples/httpdirect
        run: go test -race -timeout 600s -run TestHTTP ./...

      - name: Core (stdlib TraceIDRatioBased) baseline E2E
        # The sampler-agnostic counterpart. Without it the stdlib baseline can
        # drift silently — it had a Make target but no CI job.
        working-directory: otel-testkit/examples/httpdirect-stdlib
        run: go test -race -timeout 600s ./...
